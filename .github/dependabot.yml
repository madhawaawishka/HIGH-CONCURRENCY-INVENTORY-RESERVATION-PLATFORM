version: 2
updates:
  - package-ecosystem: npm # also covers pnpm workspaces
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # TypeScript 7 is not yet supported by typescript-eslint, @nestjs/swagger or the Nest CLI
      # (ADR-0004). Revisit when the tooling supports it.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
