name: CodeQL

# Static security analysis (SAST). Free for public repositories; private repositories need
# GitHub Advanced Security.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '23 4 * * 1' # weekly, to catch newly published vulnerability queries

permissions:
  contents: read
  security-events: write

jobs:
  analyze:
    name: Analyze (JavaScript/TypeScript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
