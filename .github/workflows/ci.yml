name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repository.
permissions:
  contents: read

# A newer push to the same branch cancels the outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: 0 # Git hooks are for local commits only.
  # prisma.config.ts requires DATABASE_URL even for `prisma generate`.
  DATABASE_URL: postgresql://stockforge:stockforge@localhost:5432/stockforge

jobs:
  quality:
    name: Format, lint, types, architecture, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm arch:check
      - run: pnpm test:cov
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage/
          retention-days: 14

  migrations:
    name: Migrations apply cleanly, no schema drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: stockforge
          POSTGRES_PASSWORD: stockforge
          POSTGRES_DB: stockforge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stockforge -d stockforge"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply all migrations to an empty database
        run: pnpm db:migrate
      - name: Fail if migrations and schema.prisma have drifted apart
        run: pnpm --filter @stockforge/database exec prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - name: Seed data loads against the migrated schema
        run: pnpm db:seed

  integration:
    name: Integration tests (real PostgreSQL via Testcontainers)
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm test:int

  build:
    name: Build
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
