# Local development dependencies. Services are added in the week they are first used:
# PostgreSQL (Week 1), Redis (Week 3), Kafka (Week 4), Prometheus/Grafana/Jaeger (Week 5).
# Credentials here are for local development only.
name: stockforge

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_USER: stockforge
      POSTGRES_PASSWORD: stockforge
      POSTGRES_DB: stockforge
    # pg_stat_statements records per-query statistics for the Week 3 performance work.
    command:
      - postgres
      - -c
      - shared_preload_libraries=pg_stat_statements
      - -c
      - pg_stat_statements.track=all
    ports:
      - '5432:5432'
    volumes:
      # PostgreSQL 18+ images keep data under /var/lib/postgresql/<major>/docker.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U stockforge -d stockforge']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
